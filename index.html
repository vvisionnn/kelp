<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Kelp</title>
		<script>
			// Apply the saved theme before first paint so dark mode never flashes light.
			(() => {
				const saved = localStorage.getItem("kelp-theme");
				const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.add(dark ? "dark" : "light");
				document.documentElement.style.colorScheme = dark ? "dark" : "light";
			})();
		</script>
		<script>
			// Ask who is signed in, and on the overview for its numbers, while the app's code downloads.
			// The app takes these answers instead of asking again (see src/lib/api.ts).
			(() => {
				const early = {};
				window.__kelpEarly = early;
				const get = (path) => {
					const response = fetch(`/api${path}`, {
						headers: { "x-kelp-csrf": "1", accept: "application/json" },
						credentials: "same-origin",
					});
					// An answer nobody takes (signed out, offline) must not surface as an error.
					response.catch(() => {});
					early[path] = { at: performance.now(), response };
				};
				get("/auth/me");
				if (location.pathname === "/") {
					get("/overview");
					get("/telemetry?range=1h");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
