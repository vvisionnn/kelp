[test]
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.95, functions = 0.95 }
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/server"
# Vendored registry components (shadcn, reui, react-bits) and generated code are third-party.
coveragePathIgnorePatterns = ["test/**", "src/components/ui/**", "src/components/reui/**", "src/components/react-bits/**", "src/routeTree.gen.ts", "src/hooks/use-copy-to-clipboard.ts", "src/hooks/use-file-upload.ts", "src/hooks/use-mobile.ts", "node_modules/**"]
