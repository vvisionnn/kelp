name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Route tree is up to date
        run: |
          bun run routes
          git diff --exit-code src/routeTree.gen.ts || { echo "::error::Run 'bun run routes' and commit src/routeTree.gen.ts."; exit 1; }
      - name: Type check (TypeScript 7)
        run: bun run typecheck
      - name: Tests with per-file coverage gate (95%)
        run: bun run coverage
      - name: Build
        run: bun run build
